name: Whalez-AI Unified Console
on: [workflow_dispatch]

jobs:
  serve-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install fastapi uvicorn jinja2 requests pytest
      - run: uvicorn api.gateway:gateway --host 0.0.0.0 --port 8080 & sleep 10 && echo "Unified console started"
