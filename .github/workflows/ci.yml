name: Whalez-AI CI Pipeline (Phase-E)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt cryptography pyjwt fastapi
      - name: Run tests
        run: pytest -q
  preflight:
    name: CI Preflight Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Verify core modules
        run: |
          python -c "import core.intent.engine, core.governance.policy_engine, core.security.vault"
          echo '✅ Core imports OK'
