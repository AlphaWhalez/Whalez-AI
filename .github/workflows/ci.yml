name: ci
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install API deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
      - name: Validate governance configs
        run: |
          python - <<'PY'
          import yaml,sys,os
          for f in ("config/services.yaml","config/policies.yaml"):
              assert os.path.exists(f), f"missing {f}"
              yaml.safe_load(open(f))
          print("governance configs OK")
          PY
      - name: Governance import smoke
        run: |
          python - <<'PY'
          from core.governance import PolicyEngine, PolicyViolation, AuditLogger, HealthMonitor, ServiceDeployer
          print("governance imports OK")
          PY
      - name: Preflight governance
        run: python scripts/ci/preflight_governance.py
      - name: Security preflight
        run: |
          python -m pip install --upgrade pip
          pip install cryptography pyjwt
          python scripts/ci/preflight_security.py
      - name: Node build (web)
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Upload web dist (summary)
        run: ls -la web/dist || true

  tls-preflight:
    name: TLS preflight
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install crypto deps
        run: |
          python -m pip install --upgrade pip
          pip install cryptography fastapi
      - name: Preflight TLS
        run: python scripts/ci/preflight_tls.py

  self_heal:
    name: Self-heal preflight
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API deps
        run: pip install fastapi uvicorn pydantic "pyjwt[crypto]" cryptography
      - name: Run self-heal preflight
        run: python scripts/ci/preflight_self_heal.py
