name: ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install API deps
        run: |
          python -m pip install --upgrade pip wheel
          pip install flask python-dotenv psutil
      - name: Smoke test API import
        run: python -c "import importlib; importlib.import_module('api.gateway')"
      - name: Node build (web)
        uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd web && npm install && npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
      - name: Preview web dist (summary)
        run: |
          echo "Web build created at web/dist" >> $GITHUB_STEP_SUMMARY
          ls -lah web/dist >> $GITHUB_STEP_SUMMARY
