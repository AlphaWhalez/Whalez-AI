name: Whalez-AI CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install flask python-dotenv psutil
      - name: Smoke import gateway
        run: python -c "import importlib.util, sys; spec=importlib.util.spec_from_file_location('gateway','api/gateway.py'); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); print('ok')"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci || npm i
      - name: Build
        run: npm run build
